name: Release

# Push a tag matching the app version (e.g. `v0.1.0`) to build installers and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.mediainfo.conf.json
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --config src-tauri/tauri.mediainfo.conf.json
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      # Developer ID signing + notarization, once the Apple secrets exist (see README). Until then the
      # build stays ad-hoc signed (tauri.conf.json signingIdentity "-"). Values only reach the build's
      # environment when every secret is set, so a half-configured repo never produces a broken build.
      - name: Apple signing and notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$SIGNING_IDENTITY" ] \
             || [ -z "$API_ISSUER" ] || [ -z "$API_KEY" ] || [ -z "$API_KEY_P8" ]; then
            echo "::notice::Apple secrets not set; building ad-hoc signed (not notarized)."
            exit 0
          fi
          # A pasted base64 certificate may have picked up line breaks.
          CERTIFICATE="$(printf '%s' "$CERTIFICATE" | tr -d ' \r\n')"
          key_path="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
          printf '%s\n' "$API_KEY_P8" > "$key_path"
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"
          # Replace the ad-hoc "-" identity in tauri.conf.json outright, rather than relying on precedence.
          signing_conf="$RUNNER_TEMP/signing.conf.json"
          SIGNING_IDENTITY="$SIGNING_IDENTITY" node -e \
            'console.log(JSON.stringify({ bundle: { macOS: { signingIdentity: process.env.SIGNING_IDENTITY } } }))' > "$signing_conf"
          echo "SIGNING_ARGS=--config $signing_conf" >> "$GITHUB_ENV"
          echo "Signing as $SIGNING_IDENTITY and notarizing."

      # Bundled into the app via tauri.mediainfo.conf.json, so nobody has to install it.
      - name: Fetch MediaInfo
        shell: bash
        run: scripts/fetch-mediainfo.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Pixname service this build uses unless someone sets another in Settings.
          # Set it under Settings → Secrets and variables → Actions → Variables.
          VITE_PIXNAME_SERVICE_URL: ${{ vars.PIXNAME_SERVICE_URL }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Pixname ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            ## Download

            - **macOS** (Apple Silicon and Intel): [Pixname_universal.dmg](https://github.com/Pixwel/pixname/releases/latest/download/Pixname_universal.dmg)
            - **Windows**: [Pixname_x64-setup.exe](https://github.com/Pixwel/pixname/releases/latest/download/Pixname_x64-setup.exe)

            Installed copies update themselves: Pixname offers the new version when it starts.

            ## First launch on macOS

            This build isn't notarized by Apple yet, so the first time you open it macOS says it "could not verify" Pixname.
            Click **Done**, open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
            You only need to do this once; updates install without it.

            On Windows, if SmartScreen appears, click **More info → Run anyway**.

            ## Setup

            Open **Settings** and paste a Pixwel API token (`svc_…` or `pat_…`).
            MediaInfo is built in, so there's nothing else to install.
          # Version-less names keep `releases/latest/download/<name>` links stable.
          assetNamePattern: "[name]_[arch][setup][ext]"
          updaterJsonPreferNsis: true
          # Published by the `publish` job once every platform has uploaded, so "latest"
          # never points at a release that's missing files or latest.json.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
