name: Release

# Push a tag matching the app version (e.g. `v0.1.0`) to build installers and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Pixname ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            ## Download

            - **macOS** (Apple Silicon and Intel): `Pixname_*_universal.dmg`
            - **Windows**: `Pixname_*_x64-setup.exe` (or the `.msi`)

            ## First launch

            These builds are not yet signed with a Pixwel developer certificate.

            - **macOS**: open the app once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
            - **Windows**: if SmartScreen appears, click **More info → Run anyway**.

            ## Requirements

            Install `ffprobe` (part of FFmpeg) so Pixname can read codec, resolution and frame rate:

            - macOS: `brew install ffmpeg` (optionally `brew install mediainfo`)
            - Windows: `winget install Gyan.FFmpeg`

            Then open **Settings** and paste a Pixwel API token (`svc_…` or `pat_…`).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
